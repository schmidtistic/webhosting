<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-warm" cx="18%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#efc37f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f1114" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cool" cx="88%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#86a7ba" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f1114" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1114"/>
  <rect width="1200" height="630" fill="url(#glow-warm)"/>
  <rect width="1200" height="630" fill="url(#glow-cool)"/>

  <!-- Outer border frame -->
  <rect x="36" y="36" width="1128" height="558" rx="22" fill="none"
        stroke="#d8bc90" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Inner accent line top -->
  <line x1="80" y1="80" x2="320" y2="80"
        stroke="#d8bc90" stroke-opacity="0.4" stroke-width="1"/>

  <!-- ARCHIVE mark -->
  <text x="80" y="72"
        font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" fill="#d8bc90"
        letter-spacing="4">ARCHIVE</text>

  <!-- Main title -->
  <text x="80" y="270"
        font-family="'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
        font-size="104" font-weight="700" fill="#f4efe7"
        letter-spacing="-2">SchmidtWorx</text>

  <!-- Divider -->
  <line x1="80" y1="310" x2="560" y2="310"
        stroke="#d8bc90" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Tagline line 1 -->
  <text x="80" y="360"
        font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif"
        font-size="26" fill="#b9afa1">A family workspace for memory, voice,</text>

  <!-- Tagline line 2 -->
  <text x="80" y="396"
        font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif"
        font-size="26" fill="#b9afa1">and what should outlast us.</text>

  <!-- Bottom domain -->
  <text x="80" y="556"
        font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" fill="#d8bc90"
        letter-spacing="2">SCHMIDTWORX.COM</text>

  <!-- Bottom accent dot -->
  <circle cx="1120" cy="556" r="4" fill="#efc37f" fill-opacity="0.6"/>
</svg>
